name: Build and Release

on:
  workflow_run:
    workflows: ["Code Coverage"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-python-package:
    runs-on: ubuntu-latest
    # Only run if:
    # 1. Code Coverage workflow completed successfully AND was triggered by a tag push, OR
    # 2. Manually triggered via workflow_dispatch
    if: |
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' && 
       startsWith(github.event.workflow_run.head_branch, 'v')) ||
      github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        # For workflow_run events, checkout the tag that triggered the original workflow
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

    - name: Install UV
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Get version for release conditions
      id: version
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
          VERSION="${{ github.event.workflow_run.head_branch }}"
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build package
      run: |
        uv sync
        uv build

    - name: Upload Python package artifacts
      uses: actions/upload-artifact@v5
      with:
        name: python-package
        path: dist/
        retention-days: 30

    - name: Publish to Test PyPI
      if: contains(steps.version.outputs.version, '-') || github.event_name == 'workflow_dispatch'
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        uv publish --check-url https://test.pypi.org/simple --publish-url https://test.pypi.org/legacy/
      continue-on-error: true

    - name: Publish to PyPI
      if: |
        (github.event_name == 'workflow_run' && !contains(steps.version.outputs.version, '-')) ||
        (github.event_name == 'workflow_dispatch' && !contains(github.event.inputs.version, '-'))
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        uv publish
  create-release:
    needs: [build-python-package]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
    - name: Download Python package artifacts
      uses: actions/download-artifact@v6
      with:
        name: python-package
        path: python-dist/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          python-dist/*.whl
          python-dist/*.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.event.workflow_run.head_branch, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
