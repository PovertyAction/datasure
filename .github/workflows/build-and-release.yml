name: Build and Release

on:
  workflow_run:
    workflows: ["Code Coverage"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-python-package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    # Only run if:
    # 1. Code Coverage workflow completed successfully AND was triggered by a tag push, OR
    # 2. Manually triggered via workflow_dispatch
    if: |
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' && 
       startsWith(github.event.workflow_run.head_branch, 'v')) ||
      github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        # For workflow_run events, checkout the tag that triggered the original workflow
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

    - name: Install UV
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Get version for release conditions
      id: version
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
          VERSION="${{ github.event.workflow_run.head_branch }}"
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        # PEP 440: anything beyond MAJOR.MINOR.PATCH (a/b/rc/dev suffixes)
        # is a pre-release. A '-' check misses suffixes like 1.0.0rc1.
        if [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        fi

    - name: Verify tag matches package version
      shell: bash
      run: |
        TAG_VERSION="${{ steps.version.outputs.version }}"
        TAG_VERSION="${TAG_VERSION#v}"
        PKG_VERSION=$(uv version --short)
        if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
          echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
          exit 1
        fi

    - name: Build package
      run: |
        uv sync
        uv build

    - name: Upload Python package artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-package
        path: dist/
        retention-days: 30

    - name: Publish to Test PyPI
      if: steps.version.outputs.is_prerelease == 'true' || github.event_name == 'workflow_dispatch'
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        uv publish --check-url https://test.pypi.org/simple --publish-url https://test.pypi.org/legacy/
      continue-on-error: true

    - name: Publish to PyPI
      if: steps.version.outputs.is_prerelease == 'false'
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        uv publish
  create-release:
    needs: [build-python-package]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
    - name: Download Python package artifacts
      uses: actions/download-artifact@v8
      with:
        name: python-package
        path: python-dist/

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          python-dist/*.whl
          python-dist/*.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: ${{ needs.build-python-package.outputs.is_prerelease == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
