name: Code Coverage

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
      - uses: pre-commit/action@v3.0.1

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v5
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Run tests with coverage
        run: just test-cov-xml

      - name: Run ruff linting with JSON output
        run: uv run ruff check --output-format=json --output-file=ruff-report.json || true

      # docs: https://github.com/marketplace/actions/official-sonarqube-scan#cloud-1
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
