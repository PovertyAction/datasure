name: Release

# Single tag-triggered release pipeline:
#   test (quality gate) -> build + verify -> publish -> GitHub release
# Publishing uses PyPI Trusted Publishing (OIDC) - no API tokens.
# Pre-releases (a/b/rc/dev) go to Test PyPI; final X.Y.Z releases go to PyPI.
#
# Hardening (audited with zizmor):
#   - actions pinned to commit SHAs (Dependabot keeps them current)
#   - permissions: {} at the workflow level; each job requests only what it needs
#   - no dependency caching in this workflow so a poisoned cache cannot
#     influence release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0). Must match pyproject.toml.'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

permissions: {}

jobs:
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

    - name: Run pre-commit hooks
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: false

    - name: Install dependencies
      run: uv sync

    - name: Run tests
      run: uv run python -m pytest tests/

  build:
    name: Build and verify package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: false

    - name: Determine version and release type
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          VERSION="$INPUT_VERSION"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        # PEP 440: a/b/rc/dev suffixes are pre-releases and go to Test PyPI.
        # Final X.Y.Z and post-releases (X.Y.Z.postN) are NOT pre-releases and
        # go to real PyPI. A '-' substring check misses suffixes like 1.0.0rc1.
        if [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
          echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
        else
          echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify tag matches package version
      shell: bash
      env:
        TAG_VERSION: ${{ steps.version.outputs.version }}
      run: |
        TAG_VERSION="${TAG_VERSION#v}"
        PKG_VERSION=$(uv version --short)
        if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
          echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
          exit 1
        fi

    - name: Build package
      run: uv build

    - name: Smoke-test the built wheel
      shell: bash
      run: |
        PKG_VERSION=$(uv version --short)
        uv venv smoke-env
        uv pip install --python smoke-env/bin/python dist/*.whl
        OUTPUT=$(smoke-env/bin/datasure --version)
        echo "datasure --version -> $OUTPUT"
        if [[ "$OUTPUT" != *"$PKG_VERSION"* ]]; then
          echo "::error::Wheel smoke test failed: expected '$PKG_VERSION' in output '$OUTPUT'"
          exit 1
        fi

    - name: Upload package artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: python-package
        path: dist/
        retention-days: 30

  publish-testpypi:
    name: Publish to Test PyPI
    needs: build
    if: needs.build.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: python-package
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false

    - name: Publish via trusted publishing
      run: >-
        uv publish
        --check-url https://test.pypi.org/simple/
        --publish-url https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: python-package
        path: dist/

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false

    - name: Publish via trusted publishing
      run: uv publish

  github-release:
    name: Create GitHub release
    needs: [build, publish-testpypi, publish-pypi]
    # Exactly one publish job runs per release; the other is skipped.
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.build.result == 'success' &&
      (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: python-package
        path: dist/

    # gh is preinstalled on the runner; using it directly avoids a
    # third-party release action (zizmor: superfluous-actions).
    - name: Create release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.build.outputs.version }}
        IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
      run: |
        args=(--generate-notes)
        if [[ "$IS_PRERELEASE" == "true" ]]; then
          args=(--prerelease "${args[@]}")
        fi
        gh release create "$TAG" dist/*.whl dist/*.tar.gz \
          --repo "$GITHUB_REPOSITORY" "${args[@]}"
