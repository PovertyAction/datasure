ShortDescription: IPA Data Management System Dashboard
Description: |-
  pyDMS is a web-based interface for data quality monitoring and high-frequency checks
  in survey data collection projects. Built with Python and Streamlit, it provides comprehensive
  data quality checks including progress monitoring, missing data analysis, duplicate detection,
  GPS validation, enumerator performance tracking, and outlier detection.

  Key Features:
  - Nine data quality check modules
  - Support for SurveyCTO, local files, and Python scripts
  - Interactive charts and visualizations
  - Configurable check parameters
  - Export capabilities for reports
