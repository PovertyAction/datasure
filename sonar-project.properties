sonar.projectKey=PovertyAction_pydms
sonar.organization=povertyaction
sonar.projectName=pyDMS
sonar.projectVersion=0.1.0

# Source code location
# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src/
sonar.tests=tests/

# Python specific settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.python.ruff.reportPaths=ruff-report.json
sonar.python.version=3.11

# File exclusions
sonar.exclusions=**/__pycache__/**,**/venv/**,**/env/**,**/archived/**,**/cache/**,**/dist/**,**/build/**,**/htmlcov/**,pydms.py,build.spec,**/*.spec,scripts/**

# Test exclusions
sonar.test.exclusions=tests/**

# Coverage exclusions
sonar.coverage.exclusions=tests/**,**/conftest.py,**/__init__.py,pydms.py,build.spec,scripts/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
